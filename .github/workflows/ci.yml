name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build clang

    - name: Configure
      run: |
        mkdir build && cd build
        cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        ninja

    - name: Test
      run: |
        cd build
        ctest --output-on-failure

    - name: Benchmark
      run: |
        cd build
        ./bench_context_switch
        ./bench_semantic_query
        ./bench_intent_compile

  build-macos:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake ninja

    - name: Configure
      run: |
        mkdir build && cd build
        cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        ninja

    - name: Test
      run: |
        cd build
        ctest --output-on-failure

  build-windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Test
      run: |
        cd build
        ctest -C Release --output-on-failure

  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format

    - name: Check formatting
      run: |
        find src include tests examples -name "*.c" -o -name "*.h" | \
          xargs clang-format --dry-run --Werror

  docs:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Check documentation
      run: |
        test -f README.md
        test -f CHANGELOG.md
        test -f CONTRIBUTING.md
        test -f CODE_OF_CONDUCT.md
        test -f docs/architecture.md
        test -f docs/getting-started.md
        test -f docs/api-reference.md
        test -f docs/intent-compiler.md
        test -f docs/kernel-design.md
        test -f docs/security.md
        test -f docs/performance.md
